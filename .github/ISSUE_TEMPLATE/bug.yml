name: Bug report
description: Something went wrong or gave an unexpected result.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Squeeze7z version
      description: Squeeze7z → About Squeeze7z.
      placeholder: "0.2.2"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Air M3, 16 GB"
    validations:
      required: true
  - type: input
    id: input
    attributes:
      label: Input
      description: Kind and size of the archive or folder, roughly how many files, and the mode you used.
      placeholder: "zip of about 2 GB, 5,000 photos and some PDFs, Smart mode"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Double-click the job's row and copy the log. It contains file and folder names, so remove anything you'd rather not share.
      render: text
